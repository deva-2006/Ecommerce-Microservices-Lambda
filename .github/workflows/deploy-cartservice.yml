name: Deploy Cart Service

on:
  push:
    branches:
      - main
    paths:
      - 'cartservice/**'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: |
          cd cartservice
          mvn clean package -DskipTests

      - name: Install Snyk CLI
        uses: snyk/actions/setup@master

      - name: Make Maven Wrapper Executable
        run: chmod +x cartservice/mvnw

      - name: Run Snyk Security Scan
        run: |
          snyk test --file=cartservice/pom.xml --severity-threshold=high -d
        env:
          SNYK_TOKEN: ${{ secrets.devaSecretSnyk }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::943755888207:role/GitHubActionsWorkflowRole
          aws-region: us-east-1

      - name: Upload to S3
        run: |
          aws s3 cp cartservice/target/cart-service-0.0.1-SNAPSHOT.jar s3://deva-lambda-artifacts/cart-service.jar

      - name: Deploy to AWS Lambda
        run: |
          aws lambda update-function-code \
            --function-name cart-service \
            --s3-bucket deva-lambda-artifacts \
            --s3-key cart-service.jar
