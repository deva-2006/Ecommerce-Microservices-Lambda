name: Deploy Review Service

on:
  push:
    branches:
      - main
    paths:
      - 'reviewservice/**'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Snyk Security Scan
        uses: snyk/actions/maven@master
        env:
          SNYK_TOKEN: ${{ secrets.devaSecretSnyk }}
        with:
          args: --file=reviewservice/pom.xml --severity-threshold=high

      - name: Build with Maven
        run: |
          cd reviewservice
          mvn clean package -DskipTests

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::943755888207:role/GitHubActionsWorkflowRole
          aws-region: us-east-1

      - name: Upload to S3
        run: |
          aws s3 cp reviewservice/target/review-service-0.0.1-SNAPSHOT.jar s3://deva-lambda-artifacts/review-service.jar

      - name: Deploy to AWS Lambda
        run: |
          aws lambda update-function-code \
            --function-name review-service \
            --s3-bucket deva-lambda-artifacts \
            --s3-key review-service.jar
