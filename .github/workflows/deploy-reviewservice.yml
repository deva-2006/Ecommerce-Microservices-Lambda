name: Deploy Review Service

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'reviewservice/**'

permissions:
  id-token: write
  contents: read

jobs:
  build-and-test:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: |
          cd reviewservice
          mvn clean package -DskipTests

      - name: Unit Tests
        run: |
          cd reviewservice
          mvn test

      - name: Save Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: review-service-jar
          path: reviewservice/target/review-service-0.0.1-SNAPSHOT.jar

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install Snyk CLI
        uses: snyk/actions/setup@master

      - name: Run Snyk Security Scan (JSON Output)
        run: |
          snyk test --file=reviewservice/pom.xml --severity-threshold=high --json > snyk-report.json || true
        env:
          SNYK_TOKEN: ${{ secrets.DEVASECRETSNYK }}

      - name: Convert JSON to HTML Report
        if: always()
        run: |
          if [ -f snyk-report.json ]; then
            npx snyk-to-html -i snyk-report.json -o snyk-report.html
          fi

      - name: Upload Snyk Security Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snyk-reviewservice-report
          path: |
            snyk-report.json
            snyk-report.html

      - name: SonarQube Scan
        run: |
          cd reviewservice
          mvn sonar:sonar -Dsonar.token=${{ secrets.SONAR_TOKEN }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  deploy:
    name: Deploy to AWS
    needs: [build-and-test, security-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: review-service-jar
          path: reviewservice/target

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::943755888207:role/GitHubActionsWorkflowRole
          aws-region: us-east-1

      - name: Upload to S3
        run: |
          aws s3 cp reviewservice/target/review-service-0.0.1-SNAPSHOT.jar s3://deva-lambda-artifacts/review-service.jar

      - name: Deploy to AWS Lambda
        run: |
          aws lambda update-function-code \
            --function-name review-service \
            --s3-bucket deva-lambda-artifacts \
            --s3-key review-service.jar