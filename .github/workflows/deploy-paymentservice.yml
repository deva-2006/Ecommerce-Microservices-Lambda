name: Deploy Payment Service

on:
  push:
    branches:
      - main
    paths:
      - 'paymentservice/**'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: |
          cd paymentservice
          mvn clean package -DskipTests

      - name: Install Snyk CLI
        uses: snyk/actions/setup@master

      - name: Make Maven Wrapper Executable
        run: chmod +x paymentservice/mvnw

      - name: Run Snyk Security Scan (JSON Output)
        run: |
          snyk test --file=paymentservice/pom.xml --severity-threshold=high --json > snyk-report.json
        env:
          SNYK_TOKEN: ${{ secrets.devaSecretSnyk }}

      - name: Convert JSON to HTML Report
        if: always()
        run: |
          npm install -g snyk-to-html
          snyk-to-html -i snyk-report.json -o snyk-report.html

      - name: Print Security Summary
        if: always()
        run: |
          if [ -f snyk-report.json ]; then
            echo "### Snyk Security Scan Summary" >> $GITHUB_STEP_SUMMARY
            node -e "
              try {
                const fs = require('fs');
                const report = JSON.parse(fs.readFileSync('snyk-report.json', 'utf8'));
                const vulns = Array.isArray(report) ? report.flatMap(r => r.vulnerabilities || []) : (report.vulnerabilities || []);
                const count = vulns.length;
                console.log('==================================================');
                console.log('TOTAL VULNERABILITIES FOUND:', count);
                console.log('==================================================');
                fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '\n* **Total High/Critical Vulnerabilities:** ' + count + '\n');
                if (count > 0) {
                  fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '\n| Severity | Package | Title | Remediation |\n| --- | --- | --- | --- |\n');
                  vulns.forEach(v => {
                    const cleanTitle = (v.title || '').replace(/|/g, '\|');
                    const cleanRemediation = (v.remediation || 'Upgrade dependency').replace(/\n/g, ' ').replace(/|/g, '\|');
                    fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '| ' + v.severity + ' | ' + v.packageName + ' | ' + cleanTitle + ' | ' + cleanRemediation + ' |\n');
                  });
                } else {
                  fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '\n:white_check_mark: No high-severity vulnerabilities found!\n');
                }
              } catch (e) {
                console.error('Failed to parse Snyk report:', e);
              }
            "
          else
            echo "Snyk report not found."
          fi


      - name: Upload Snyk Security Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snyk-paymentservice-report
          path: |
            snyk-report.json
            snyk-report.html

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::943755888207:role/GitHubActionsWorkflowRole
          aws-region: us-east-1

      - name: Upload to S3
        run: |
          aws s3 cp paymentservice/target/payment-service-0.0.1-SNAPSHOT.jar s3://deva-lambda-artifacts/payment-service.jar

      - name: Deploy to AWS Lambda
        run: |
          aws lambda update-function-code \
            --function-name payment-service \
            --s3-bucket deva-lambda-artifacts \
            --s3-key payment-service.jar