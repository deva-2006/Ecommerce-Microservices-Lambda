name: Deploy Order Service

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'orderservice/**'

permissions:
  id-token: write
  contents: read

jobs:
  build-and-test:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: |
          cd orderservice
          mvn clean package -DskipTests

      - name: Unit Tests
        run: |
          cd orderservice
          mvn test

      - name: Save Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: order-service-jar
          path: orderservice/target/order-service-0.0.1-SNAPSHOT.jar

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install Snyk CLI
        uses: snyk/actions/setup@master

      - name: Run Snyk Security Scan (JSON Output)
        run: |
          snyk test --file=orderservice/pom.xml --severity-threshold=high --json > snyk-report.json || true
        env:
          SNYK_TOKEN: ${{ secrets.DEVASECRETSNYK }}

      - name: Convert JSON to HTML Report
        if: always()
        run: |
          if [ -f snyk-report.json ]; then
            npx snyk-to-html -i snyk-report.json -o snyk-report.html
          fi

      - name: Upload Snyk Security Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snyk-orderservice-report
          path: |
            snyk-report.json
            snyk-report.html

      - name: SonarQube Scan
        run: |
          cd orderservice
          mvn clean test jacoco:report org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dmaven.test.failure.ignore=true \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.organization=deva-2006 \
            -Dsonar.projectKey=deva-2006_order-service \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.host.url=https://sonarcloud.io
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Print Quality & Security Summary
        if: always()
        run: |
          node .github/workflows/print-quality-summary.js "Order Service" "orderservice" "deva-2006_order-service"


  deploy:
    name: Deploy to AWS
    needs: [build-and-test, security-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: order-service-jar
          path: orderservice/target

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::943755888207:role/GitHubActionsWorkflowRole
          aws-region: us-east-1

      - name: Upload to S3
        run: |
          aws s3 cp orderservice/target/order-service-0.0.1-SNAPSHOT.jar s3://deva-lambda-artifacts/order-service.jar

      - name: Deploy Order API Lambda
        run: |
          aws lambda update-function-code \
            --function-name order-service \
            --s3-bucket deva-lambda-artifacts \
            --s3-key order-service.jar
      - name: Publish Lambda Version & Move Prod Alias (order-service)
        run: |
          aws lambda wait function-updated --function-name order-service --region us-east-1
          VERSION=$(aws lambda publish-version --function-name order-service --region us-east-1 --query "Version" --output text)
          echo "Published version: $VERSION"
          
          STATUS=""
          for i in $(seq 1 30); do
            STATUS=$(aws lambda list-versions-by-function --function-name order-service --region us-east-1 --query "Versions[?Version=='$VERSION'].SnapStart.OptimizationStatus | [0]" --output text)
            echo "Waiting for SnapStart optimization on order-service (v$VERSION), current status: $STATUS..."
            if [ "$STATUS" = "On" ]; then break; fi
            sleep 5
          done
          
          if [ "$STATUS" != "On" ]; then
            echo "Error: SnapStart optimization timed out or failed for order-service (v$VERSION)"
            exit 1
          fi
          
          aws lambda update-alias --function-name order-service --name prod --function-version $VERSION --region us-east-1
          echo "Prod alias updated to v$VERSION for order-service"
          
          VERSIONS=$(aws lambda list-versions-by-function --function-name order-service --region us-east-1 --query "Versions[?Version!='\$LATEST'].Version | sort_by(@, &to_number(@))" --output text)
          COUNT=$(echo $VERSIONS | wc -w)
          if [ $COUNT -gt 2 ]; then
            TO_DELETE=$(echo $VERSIONS | tr '\t' '\n' | head -n -2)
            for v in $TO_DELETE; do
              echo "Deleting old version v$v for order-service..."
              aws lambda delete-function --function-name order-service --qualifier $v --region us-east-1 || true
            done
          fi

      - name: Deploy Order SQS Consumer Lambda
        run: |
          aws lambda update-function-code \
            --function-name order-payment-consumer-lambda \
            --s3-bucket deva-lambda-artifacts \
            --s3-key order-service.jar

      - name: Publish Lambda Version & Move Prod Alias (order-payment-consumer-lambda)
        run: |
          aws lambda wait function-updated --function-name order-payment-consumer-lambda --region us-east-1
          VERSION=$(aws lambda publish-version --function-name order-payment-consumer-lambda --region us-east-1 --query "Version" --output text)
          echo "Published version: $VERSION"
          
          STATUS=""
          for i in $(seq 1 30); do
            STATUS=$(aws lambda list-versions-by-function --function-name order-payment-consumer-lambda --region us-east-1 --query "Versions[?Version=='$VERSION'].SnapStart.OptimizationStatus | [0]" --output text)
            echo "Waiting for SnapStart optimization on order-payment-consumer-lambda (v$VERSION), current status: $STATUS..."
            if [ "$STATUS" = "On" ]; then break; fi
            sleep 5
          done
          
          if [ "$STATUS" != "On" ]; then
            echo "Error: SnapStart optimization timed out or failed for order-payment-consumer-lambda (v$VERSION)"
            exit 1
          fi
          
          aws lambda update-alias --function-name order-payment-consumer-lambda --name prod --function-version $VERSION --region us-east-1
          echo "Prod alias updated to v$VERSION for order-payment-consumer-lambda"
          
          VERSIONS=$(aws lambda list-versions-by-function --function-name order-payment-consumer-lambda --region us-east-1 --query "Versions[?Version!='\$LATEST'].Version | sort_by(@, &to_number(@))" --output text)
          COUNT=$(echo $VERSIONS | wc -w)
          if [ $COUNT -gt 2 ]; then
            TO_DELETE=$(echo $VERSIONS | tr '\t' '\n' | head -n -2)
            for v in $TO_DELETE; do
              echo "Deleting old version v$v for order-payment-consumer-lambda..."
              aws lambda delete-function --function-name order-payment-consumer-lambda --qualifier $v --region us-east-1 || true
            done
          fi