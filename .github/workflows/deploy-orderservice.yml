name: Deploy Order Service

on:
  push:
    branches:
      - main
    paths:
      - 'orderservice/**'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: |
          cd orderservice
          mvn clean package -DskipTests

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::943755888207:role/GitHubActionsWorkflowRole
          aws-region: us-east-1

      - name: Deploy Order API Lambda
        run: |
          aws lambda update-function-code \
            --function-name order-service \
            --zip-file fileb://orderservice/target/order-service-0.0.1-SNAPSHOT.jar

      - name: Deploy Order SQS Consumer Lambda
        run: |
          aws lambda update-function-code \
            --function-name order-payment-consumer-lambda \
            --zip-file fileb://orderservice/target/order-service-0.0.1-SNAPSHOT.jar
