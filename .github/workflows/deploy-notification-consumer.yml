name: Deploy Notification Consumer Service

on:
  push:
    branches:
      - main
    paths:
      - 'notification-consumer-lambda/**'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install Snyk CLI
        uses: snyk/actions/setup@master

      - name: Run Snyk Security Scan
        run: |
          snyk test --file=notification-consumer-lambda/pom.xml --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.devaSecretSnyk }}

      - name: Build with Maven
        run: |
          cd notification-consumer-lambda
          mvn clean package -DskipTests

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::943755888207:role/GitHubActionsWorkflowRole
          aws-region: us-east-1

      - name: Upload to S3
        run: |
          aws s3 cp notification-consumer-lambda/target/notification-consumer-lambda-0.0.1-SNAPSHOT.jar s3://deva-lambda-artifacts/notification-consumer-lambda.jar

      - name: Deploy to AWS Lambda
        run: |
          aws lambda update-function-code \
            --function-name notification-consumer-lambda \
            --s3-bucket deva-lambda-artifacts \
            --s3-key notification-consumer-lambda.jar
