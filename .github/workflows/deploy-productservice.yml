name: Deploy Product Service

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'productservice/**'

permissions:
  id-token: write
  contents: read

jobs:
  build-and-test:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: |
          cd productservice
          mvn clean package -DskipTests

      - name: Unit Tests
        run: |
          cd productservice
          mvn test

      - name: Save Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: product-service-jar
          path: productservice/target/product-service-0.0.1-SNAPSHOT.jar

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install Snyk CLI
        uses: snyk/actions/setup@master

      - name: Run Snyk Security Scan (JSON Output)
        run: |
          snyk test --file=productservice/pom.xml --severity-threshold=high --json > snyk-report.json || true
        env:
          SNYK_TOKEN: ${{ secrets.DEVASECRETSNYK }}

      - name: Convert JSON to HTML Report
        if: always()
        run: |
          if [ -f snyk-report.json ]; then
            npx snyk-to-html -i snyk-report.json -o snyk-report.html
          fi

      - name: Upload Snyk Security Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snyk-productservice-report
          path: |
            snyk-report.json
            snyk-report.html

      - name: SonarQube Scan
        run: |
          cd productservice
          mvn clean test jacoco:report org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dmaven.test.failure.ignore=true \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.organization=deva-2006 \
            -Dsonar.projectKey=deva-2006_product-service \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.host.url=https://sonarcloud.io
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Print Quality & Security Summary
        if: always()
        run: |
          node .github/workflows/print-quality-summary.js "Product Service" "productservice" "deva-2006_product-service"


  deploy:
    name: Deploy to AWS
    needs: [build-and-test, security-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: product-service-jar
          path: productservice/target

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::943755888207:role/GitHubActionsWorkflowRole
          aws-region: us-east-1

      - name: Upload to S3
        run: |
          aws s3 cp productservice/target/product-service-0.0.1-SNAPSHOT.jar s3://deva-lambda-artifacts/product-service.jar

      - name: Deploy to AWS Lambda
        run: |
          aws lambda update-function-code \
            --function-name product-service \
            --s3-bucket deva-lambda-artifacts \
            --s3-key product-service.jar
      - name: Publish Lambda Version (activates SnapStart snapshot)
        run: |
          aws lambda wait function-updated --function-name product-service --region us-east-1
          aws lambda publish-version --function-name product-service --region us-east-1