name: Deploy Frontend

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Snyk CLI
        uses: snyk/actions/setup@master

      - name: Run Snyk Security Scan (JSON Output)
        run: |
          snyk test --severity-threshold=high --json > snyk-report.json || true
        env:
          SNYK_TOKEN: ${{ secrets.DEVASECRETSNYK }}

      - name: Run Snyk Codebase Security Scan (JSON Output)
        run: |
          snyk code test --severity-threshold=high --json > snyk-code-report.json || true
        env:
          SNYK_TOKEN: ${{ secrets.DEVASECRETSNYK }}

      - name: Convert JSON to HTML Report
        if: always()
        run: |
          if [ -f snyk-report.json ]; then
            npx snyk-to-html -i snyk-report.json -o snyk-report.html
          fi
          if [ -f snyk-code-report.json ]; then
            npx snyk-to-html -i snyk-code-report.json -o snyk-code-report.html
          fi

      - name: Print Security Summary
        if: always()
        run: |
          node .github/workflows/print-snyk-summary.cjs

      - name: Upload Snyk Security Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snyk-frontend-report
          path: |
            snyk-report.json
            snyk-report.html
            snyk-code-report.json
            snyk-code-report.html

      - name: Build Frontend
        run: npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::943755888207:role/GitHubActionsWorkflowRole
          aws-region: us-east-1

      - name: Deploy to S3
        run: |
          aws s3 sync dist/ s3://my-ecommerce-frontend-deva2006 --delete

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E1UOOQSQUW4GDB \
            --paths "/*"
