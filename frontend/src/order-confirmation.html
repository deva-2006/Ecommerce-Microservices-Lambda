<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShopVibe — Order Confirmed!</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%234f46e5'/><path d='M21 11.5C21 9.567 19.433 8 17.5 8H13.5C11.567 8 10 9.567 10 11.5C10 13.433 11.567 15 13.5 15H18.5C20.433 15 22 16.567 22 18.5C22 20.433 20.433 22 18.5 22H14.5C12.567 22 11 20.433 11 18.5' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
  <link rel="stylesheet" href="/css/style.css" />
  <script>document.documentElement.setAttribute("data-theme", localStorage.getItem("theme-preference") || "light");</script>
</head>
<body>
  <div id="navbar"></div>

  <main class="container py-4" style="max-width: 700px;">
    <div id="confirmationContent" class="text-center">
      <div style="background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 36px 28px; text-align: center; margin-top: 30px; box-shadow: var(--shadow-sm);">
        <div class="skeleton" style="width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 20px;"></div>
        <div class="skeleton" style="height: 28px; width: 220px; margin: 0 auto 12px; border-radius: 6px;"></div>
        <div class="skeleton" style="height: 16px; width: 320px; margin: 0 auto 28px; border-radius: 4px;"></div>
        <div style="background: var(--bg-alt); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; text-align: left; margin-bottom: 28px; display: flex; flex-direction: column; gap: 14px;">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <div class="skeleton" style="height: 14px; width: 100px;"></div>
            <div class="skeleton" style="height: 14px; width: 120px;"></div>
          </div>
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <div class="skeleton" style="height: 14px; width: 80px;"></div>
            <div class="skeleton" style="height: 20px; width: 90px; border-radius: 12px;"></div>
          </div>
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <div class="skeleton" style="height: 14px; width: 130px;"></div>
            <div class="skeleton" style="height: 14px; width: 140px;"></div>
          </div>
        </div>
        <div style="display: flex; gap: 14px; justify-content: center;">
          <div class="skeleton" style="height: 44px; width: 160px; border-radius: var(--radius);"></div>
          <div class="skeleton" style="height: 44px; width: 160px; border-radius: var(--radius);"></div>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="/js/order-confirmation.js"></script>
</body>
</html>
