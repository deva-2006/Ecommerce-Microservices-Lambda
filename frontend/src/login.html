<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShopVibe — Login</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%234f46e5'/><path d='M21 11.5C21 9.567 19.433 8 17.5 8H13.5C11.567 8 10 9.567 10 11.5C10 13.433 11.567 15 13.5 15H18.5C20.433 15 22 16.567 22 18.5C22 20.433 20.433 22 18.5 22H14.5C12.567 22 11 20.433 11 18.5' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
  <link rel="preconnect" href="https://73svzbgcrf.execute-api.us-east-1.amazonaws.com" crossorigin />
  <link rel="dns-prefetch" href="https://73svzbgcrf.execute-api.us-east-1.amazonaws.com" />
  <link rel="stylesheet" href="/css/style.css" />
  <script>document.documentElement.setAttribute("data-theme", localStorage.getItem("theme-preference") || "light");</script>
</head>
<body class="no-header">
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">S</div>
        <h2 class="auth-title">Welcome back</h2>
        <p class="auth-subtitle">Sign in to your account</p>
      </div>

      <div class="toggle">
        <button id="customerTab" class="active" type="button">Customer</button>
        <button id="adminTab" type="button">Admin</button>
      </div>

      <form id="loginForm" autocomplete="on">
        <div class="form-group">
          <label class="form-label" for="email">Email address</label>
          <input type="email" id="email" name="email" class="form-input" placeholder="you@example.com" autocomplete="email" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div style="position: relative;">
            <input type="password" id="password" name="password" class="form-input" placeholder="Enter your password" autocomplete="current-password" style="padding-right: 40px;" required />
            <button type="button" id="passwordToggle" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text-muted);">
              <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="form-group" style="display:flex;align-items:center;justify-content:space-between;">
          <div style="display:flex;align-items:center;gap:8px;">
            <input type="checkbox" id="rememberMe" name="rememberMe" />
            <label for="rememberMe" style="font-size:14px;color:var(--text-secondary);cursor:pointer;">Remember me</label>
          </div>
          <a href="#" id="forgotPasswordBtn" style="font-size:13px;color:var(--accent);text-decoration:none;">Forgot password?</a>
        </div>

        <button type="submit" id="loginBtn" class="btn btn-primary btn-block btn-lg mt-1">Sign In</button>
      </form>

      <p id="msg" class="mt-2"></p>

      <div id="verifySection" class="hidden mt-2">
        <div class="form-group">
          <label class="form-label">Verification code</label>
          <input type="text" id="verifyCode" class="form-input" placeholder="Enter 6-digit code" />
        </div>
        <button id="verifyBtn" class="btn btn-primary btn-block btn-lg mt-1">Verify & Sign In</button>
        <p id="verifyMsg" class="mt-2"></p>
        <button id="resendBtn" class="btn btn-ghost btn-sm mt-2" style="width:100%;">Resend Code</button>
      </div>

      <p id="signupLink" class="auth-footer">
        Don't have an account? <a href="/signup.html">Create one</a>
      </p>

      <div class="mt-3 text-center">
        <button id="themeToggle" class="btn btn-ghost btn-sm">Toggle theme</button>
      </div>
    </div>
  </div>

  <script type="module" src="/js/bg-effects.js"></script>
  <script type="module" src="/js/login.js"></script>
</body>
</html>
